version: "3.8"
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: geheim123
      MYSQL_DATABASE: bibliothek_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
volumes:
  db_data:
